<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Waypoint pitch deck, fictional example</title>
<desc id="desc">An original presentation study showing a title slide, a buyer problem slide, and a rollout plan. Not client work.</desc>
<defs>
 <linearGradient id="stage" x2="0.8" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#33545a"/><stop offset="1" stop-color="#0d212a"/></linearGradient>
 <linearGradient id="hero" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#15373e"/><stop offset="1" stop-color="#0e252e"/></linearGradient>
 <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#b6d0c5" opacity=".15"/></pattern>
 <filter id="shadow" x="-35%" y="-55%" width="170%" height="215%"><feGaussianBlur stdDeviation="10"/></filter>
 <clipPath id="heroClip"><rect width="690" height="388" rx="9"/></clipPath>
</defs>
<rect width="1200" height="760" fill="url(#stage)"/>
<rect width="1200" height="760" fill="url(#grid)"/>
<path d="M0 710h1200M30 0v760M1170 0v760" fill="none" stroke="#e6e1d2" opacity=".2"/>
<g font-family="system-ui, sans-serif" font-weight="650" font-size="14" fill="#e3e4d7" letter-spacing="3">
 <text x="49" y="54">DALE PITTMAN  /  PITCH DECK SPRINT</text>
 <text x="1150" y="54" text-anchor="end">FICTIONAL SAMPLE</text>
</g>
<g transform="translate(714 121) rotate(9 207 117)">
 <rect x="0" y="16" width="415" height="234" rx="7" fill="#03141b" opacity=".62" filter="url(#shadow)"/>
 <rect width="415" height="234" rx="7" fill="#eee9d8"/>
 <text x="27" y="38" fill="#42635b" font-family="system-ui, sans-serif" font-size="12" font-weight="750" letter-spacing="2">02  /  THE PROBLEM</text>
 <text x="27" y="78" fill="#153139" font-family="Georgia, serif" font-size="27">One shift. Three systems.</text>
 <text x="27" y="110" fill="#355458" font-family="system-ui, sans-serif" font-size="13">Local operators lose the handoff between</text>
 <text x="27" y="130" fill="#355458" font-family="system-ui, sans-serif" font-size="13">what's booked, what's prepped, and what ships.</text>
 <path d="M44 167h316" fill="none" stroke="#7e9990" stroke-dasharray="5 4"/>
 <g fill="#2c5350"><circle cx="44" cy="167" r="7"/><circle cx="202" cy="167" r="7"/><circle cx="360" cy="167" r="7"/></g>
 <g fill="#1b3e43" font-family="system-ui, sans-serif" font-size="11" font-weight="700"><text x="27" y="195">BOOK</text><text x="182" y="195">PREP</text><text x="341" y="195">SHIP</text></g>
</g>
<g transform="translate(682 422) rotate(-6 216 121)">
 <rect x="0" y="16" width="432" height="243" rx="7" fill="#03141b" opacity=".62" filter="url(#shadow)"/>
 <rect width="432" height="243" rx="7" fill="#d9a86e"/>
 <text x="27" y="38" fill="#493621" font-family="system-ui, sans-serif" font-size="12" font-weight="750" letter-spacing="2">06  /  GO-TO-MARKET</text>
 <text x="27" y="79" fill="#253633" font-family="Georgia, serif" font-size="27">From one pilot to a network.</text>
 <g fill="#243f3b" font-family="system-ui, sans-serif" font-size="11" font-weight="700"><text x="29" y="205">ONE VENUE</text><text x="160" y="205">ONE DISTRICT</text><text x="305" y="205">ONE CITY</text></g>
 <g fill="#34594e"><rect x="29" y="151" width="84" height="35" rx="2"/><rect x="158" y="132" width="84" height="54" rx="2"/><rect x="302" y="103" width="84" height="83" rx="2"/></g>
 <path d="M27 188h363" fill="none" stroke="#243f3b"/>
</g>
<g transform="translate(83 217) rotate(-5 345 194)">
 <rect x="0" y="16" width="690" height="388" rx="9" fill="#03141b" opacity=".62" filter="url(#shadow)"/>
 <rect width="690" height="388" rx="9" fill="url(#hero)" stroke="#6f8b80" stroke-width="1.3"/>
 <g clip-path="url(#heroClip)" fill="none">
  <ellipse cx="622" cy="237" rx="225" ry="195" stroke="#dba773" opacity=".77" transform="rotate(-18 622 237)"/>
  <ellipse cx="622" cy="237" rx="198" ry="159" stroke="#dba773" opacity=".53" transform="rotate(-18 622 237)"/>
  <ellipse cx="622" cy="237" rx="170" ry="125" stroke="#dba773" opacity=".41" transform="rotate(-18 622 237)"/>
  <ellipse cx="622" cy="237" rx="144" ry="93" stroke="#dba773" opacity=".28" transform="rotate(-18 622 237)"/>
  <path d="M386 327Q484 131 704 92" stroke="#edbf8a" stroke-width="3"/>
  <circle cx="492" cy="192" r="6" fill="#edbf8a"/>
 </g>
 <text x="42" y="49" fill="#e4b484" font-family="system-ui, sans-serif" font-size="13" letter-spacing="3">01  /  INVESTOR DECK</text>
 <text x="37" y="168" fill="#f4efe2" font-family="Georgia, serif" font-size="100">Waypoint.</text>
 <text x="44" y="223" fill="#e1e4d8" font-family="system-ui, sans-serif" font-weight="500" font-size="24">The operating layer for</text>
 <text x="44" y="254" fill="#e1e4d8" font-family="system-ui, sans-serif" font-weight="500" font-size="24">independent hospitality.</text>
 <path d="M44 314h364" stroke="#c3d4c7" opacity=".45"/>
 <text x="44" y="342" fill="#c3d4c7" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2">NARRATIVE  /  SYSTEM  /  FINAL DESIGN</text>
</g>
<g font-family="system-ui, sans-serif" font-size="13" font-weight="650" fill="#e3e4d7" letter-spacing="2">
 <text x="49" y="740">SAMPLE PRESENTATION SYSTEM</text>
 <text x="1150" y="740" text-anchor="end">COVER  /  PROBLEM  /  ROLLOUT</text>
</g>
</svg>
